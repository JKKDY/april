name: April CI

on:
  push:
    branches: [ "main", "dev" ]

  pull_request:
    branches: [ "main", "dev" ]

  workflow_dispatch:

jobs:
  build_and_test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        include:
          # =========================================================
          # XSIMD — ISA COVERAGE
          # =========================================================

          # Baseline x86-64:
          # SSE + SSE2
          - name: Linux (Clang 18, XSIMD, SSE2)
            os: ubuntu-24.04
            build_type: Release
            cxx: clang++-18
            cc: clang-18
            simd_backend: XSIMD
            arch_flags: "-DAPRIL_MARCH=x86-64"
            cmake_flags: ""
            run_tests: true

          # x86-64-v2:
          # SSE3 + SSSE3 + SSE4.1 + SSE4.2
          - name: Linux (GCC 14, XSIMD, SSE4.2)
            os: ubuntu-24.04
            build_type: Release
            cxx: g++-14
            cc: gcc-14
            simd_backend: XSIMD
            arch_flags: "-DAPRIL_MARCH=x86-64-v2"
            cmake_flags: ""
            run_tests: true

          # x86-64-v3:
          # AVX + AVX2 + FMA
          - name: Linux (Clang 18, XSIMD, AVX2)
            os: ubuntu-24.04
            build_type: Release
            cxx: clang++-18
            cc: clang-18
            simd_backend: XSIMD
            arch_flags: "-DAPRIL_MARCH=x86-64-v3"
            cmake_flags: ""
            run_tests: true

          # x86-64-v4:
          # AVX-512F/BW/CD/DQ/VL
          #
          # Compile-only because GitHub's standard x64 runner does not
          # guarantee that the host CPU exposes AVX-512.
          - name: Linux (GCC 14, XSIMD, AVX-512, Compile)
            os: ubuntu-24.04
            build_type: Release
            cxx: g++-14
            cc: gcc-14
            simd_backend: XSIMD
            arch_flags: "-DAPRIL_MARCH=x86-64-v4"
            cmake_flags: ""
            run_tests: false

          # Apple Silicon / ARM64 NEON
          - name: macOS (Apple Clang, XSIMD, NEON)
            os: macos-15
            build_type: Release
            cxx: clang++
            cc: clang
            simd_backend: XSIMD
            arch_flags: ""
            cmake_flags: "-DCMAKE_OSX_DEPLOYMENT_TARGET=14.0"
            run_tests: true

          # Linux ARM64 / NEON
          - name: Linux ARM64 (Clang 18, XSIMD, NEON)
            os: ubuntu-24.04-arm
            build_type: Release
            cxx: clang++-18
            cc: clang-18
            simd_backend: XSIMD
            arch_flags: ""
            cmake_flags: ""
            run_tests: true

          # =========================================================
          # WINDOWS
          # =========================================================

          - name: Windows (MSVC, XSIMD, AVX2)
            os: windows-latest
            build_type: Release
            cxx: cl
            cc: cl
            simd_backend: XSIMD
            arch_flags: "-DAPRIL_MSVC_ARCH=AVX2"
            cmake_flags: ""
            run_tests: true

          - name: Windows (MinGW, XSIMD, AVX2)
            os: windows-latest
            build_type: Release
            cxx: g++
            cc: gcc
            simd_backend: XSIMD
            arch_flags: "-DAPRIL_MARCH=x86-64-v3"
            cmake_flags: ""
            run_tests: true

          # =========================================================
          # SANITIZERS
          #
          # No architecture override here. These are correctness jobs,
          # not ISA coverage jobs.
          # =========================================================

          - name: Linux (Clang 18, XSIMD, ASAN + UBSAN)
            os: ubuntu-24.04
            build_type: Debug
            cxx: clang++-18
            cc: clang-18
            simd_backend: XSIMD
            arch_flags: ""
            cmake_flags: "-DAPRIL_USE_ASAN=ON -DAPRIL_USE_UBSAN=ON"
            run_tests: true

          - name: Linux (GCC 14, XSIMD, TSAN)
            os: ubuntu-24.04
            build_type: Debug
            cxx: g++-14
            cc: gcc-14
            simd_backend: XSIMD
            arch_flags: ""
            cmake_flags: "-DAPRIL_USE_TSAN=ON"
            run_tests: true

          # =========================================================
          # STD::SIMD
          # =========================================================

          - name: Linux (Clang 18, std::simd)
            os: ubuntu-24.04
            build_type: Release
            cxx: clang++-18
            cc: clang-18
            simd_backend: STD_SIMD
            arch_flags: "-DAPRIL_MARCH=x86-64"
            cmake_flags: ""
            run_tests: true

          - name: Linux (GCC 14, std::simd, AVX2 + OpenMP)
            os: ubuntu-24.04
            build_type: Release
            cxx: g++-14
            cc: gcc-14
            simd_backend: STD_SIMD
            arch_flags: "-DAPRIL_MARCH=x86-64-v3"
            cmake_flags: "-DAPRIL_ENABLE_OPENMP=ON"
            run_tests: true

          # =========================================================
          # EXECUTOR COVERAGE
          # =========================================================

          - name: Windows (MSVC, XSIMD, AVX2 + OpenMP)
            os: windows-latest
            build_type: Release
            cxx: cl
            cc: cl
            simd_backend: XSIMD
            arch_flags: "-DAPRIL_MSVC_ARCH=AVX2"
            cmake_flags: "-DAPRIL_ENABLE_OPENMP=ON"
            run_tests: true

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install compilers (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-14 \
            g++-14 \
            clang-18

      - name: Set up MSVC Developer Command Prompt
        if: matrix.cxx == 'cl'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Print toolchain
        shell: bash
        run: |
          "${{ matrix.cxx }}" --version || true
          cmake --version
          ninja --version

          if [[ "${{ runner.os }}" == "Linux" ]]; then
            uname -m
            lscpu || true
          fi

      - name: Configure CMake
        shell: bash
        run: |
          cmake_args=(
            -G Ninja
            -S .
            -B build
            "-DCMAKE_BUILD_TYPE=${{ matrix.build_type }}"
            "-DCMAKE_C_COMPILER=${{ matrix.cc }}"
            "-DCMAKE_CXX_COMPILER=${{ matrix.cxx }}"
            "-DAPRIL_SIMD_BACKEND=${{ matrix.simd_backend }}"
            -DAPRIL_BUILD_TESTS=ON
            -DAPRIL_BUILD_EXAMPLES=ON
            -DAPRIL_ENABLE_FAST_MATH=OFF
          )

          arch_flags="${{ matrix.arch_flags }}"

          if [[ -n "$arch_flags" ]]; then
            read -ra parsed_arch_flags <<< "$arch_flags"
            cmake_args+=("${parsed_arch_flags[@]}")
          fi

          extra_flags="${{ matrix.cmake_flags }}"

          if [[ -n "$extra_flags" ]]; then
            read -ra parsed_flags <<< "$extra_flags"
            cmake_args+=("${parsed_flags[@]}")
          fi

          cmake "${cmake_args[@]}"

      - name: Build all targets
        shell: bash
        run: |
          cmake --build build \
            --config "${{ matrix.build_type }}" \
            -j 4

      - name: Run tests
        if: matrix.run_tests
        shell: bash
        run: |
          ctest \
            --test-dir build \
            --output-on-failure \
            --build-config "${{ matrix.build_type }}"

  coverage:
    name: Linux (Clang 18, Scalar, Coverage)
    runs-on: ubuntu-24.04

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Clang 18
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang-18 \
            llvm-18

      - name: Configure CMake
        shell: bash
        run: |
          cmake \
            -G Ninja \
            -S . \
            -B build-coverage \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang-18 \
            -DCMAKE_CXX_COMPILER=clang++-18 \
            -DAPRIL_SIMD_BACKEND=SCALAR \
            -DAPRIL_BUILD_TESTS=ON \
            -DAPRIL_BUILD_EXAMPLES=OFF \
            -DAPRIL_ENABLE_FAST_MATH=OFF \
            -DAPRIL_ENABLE_COVERAGE=ON

      - name: Build
        shell: bash
        run: |
          cmake --build build-coverage -j 4

      - name: Run tests
        shell: bash
        run: |
          export LLVM_PROFILE_FILE="$GITHUB_WORKSPACE/build-coverage/test_april-%p.profraw"

          ctest \
            --test-dir build-coverage \
            --output-on-failure

      - name: Merge profile data
        shell: bash
        run: |
          llvm-profdata-18 merge \
            -sparse \
            build-coverage/*.profraw \
            -o build-coverage/coverage.profdata

      - name: Generate coverage report
        shell: bash
        run: |
          llvm-cov-18 export \
            -format=lcov \
            build-coverage/test/test_april \
            -instr-profile=build-coverage/coverage.profdata \
            -ignore-filename-regex="test/|external/|build-coverage/" \
            > build-coverage/coverage.lcov

      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./build-coverage/coverage.lcov
          fail_ci_if_error: true