name: April CI

on:
  push:
    branches: ["main", "dev"]

  pull_request:
    branches: ["main", "dev"]

  workflow_dispatch:

# CI only needs read access to the repository.
permissions:
  contents: read

# If new commits are pushed to the same PR/branch, cancel the obsolete run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build_and_test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        include:
          # =========================================================
          # XSIMD — ISA COVERAGE
          # =========================================================

          # Baseline x86-64:
          # SSE + SSE2
          - name: Linux (Clang 18, XSIMD, SSE2)
            os: ubuntu-24.04
            build_type: Release
            cxx: clang++-18
            simd_backend: XSIMD
            arch_flags: "-DAPRIL_MARCH=x86-64"
            cmake_flags: ""
            run_tests: true

          # x86-64-v2:
          # SSE3 + SSSE3 + SSE4.1 + SSE4.2
          - name: Linux (GCC 14, XSIMD, SSE4.2)
            os: ubuntu-24.04
            build_type: Release
            cxx: g++-14
            simd_backend: XSIMD
            arch_flags: "-DAPRIL_MARCH=x86-64-v2"
            cmake_flags: ""
            run_tests: true

          # x86-64-v3:
          # AVX + AVX2 + FMA
          - name: Linux (Clang 18, XSIMD, AVX2)
            os: ubuntu-24.04
            build_type: Release
            cxx: clang++-18
            simd_backend: XSIMD
            arch_flags: "-DAPRIL_MARCH=x86-64-v3"
            cmake_flags: ""
            run_tests: true

          # x86-64-v4:
          # AVX-512F/BW/CD/DQ/VL
          #
          # Compile-only because GitHub's standard x64 runner does not
          # guarantee that the host CPU exposes AVX-512.
          - name: Linux (GCC 14, XSIMD, AVX-512, Compile Only)
            os: ubuntu-24.04
            build_type: Release
            cxx: g++-14
            simd_backend: XSIMD
            arch_flags: "-DAPRIL_MARCH=x86-64-v4"
            cmake_flags: ""
            run_tests: false

          # Apple Silicon / ARM64 NEON
          - name: macOS (Apple Clang, XSIMD, NEON)
            os: macos-15
            build_type: Release
            cxx: clang++
            simd_backend: XSIMD
            arch_flags: ""
            cmake_flags: "-DCMAKE_OSX_DEPLOYMENT_TARGET=14.0"
            run_tests: true

          # Linux ARM64 / NEON
          - name: Linux ARM64 (Clang 18, XSIMD, NEON)
            os: ubuntu-24.04-arm
            build_type: Release
            cxx: clang++-18
            simd_backend: XSIMD
            arch_flags: ""
            cmake_flags: ""
            run_tests: true

          # =========================================================
          # WINDOWS
          # =========================================================

          - name: Windows (MSVC, XSIMD, AVX2)
            os: windows-latest
            build_type: Release
            cxx: cl
            simd_backend: XSIMD
            arch_flags: "-DAPRIL_MSVC_ARCH=AVX2"
            cmake_flags: ""
            run_tests: true

          - name: Windows (MinGW, XSIMD, AVX2)
            os: windows-latest
            build_type: Release
            cxx: g++
            simd_backend: XSIMD
            arch_flags: "-DAPRIL_MARCH=x86-64-v3"
            cmake_flags: ""
            run_tests: true

          # =========================================================
          # SANITIZERS
          #
          # No architecture override here. These are correctness jobs,
          # not ISA coverage jobs.
          # =========================================================

          - name: Linux (Clang 18, XSIMD, ASAN + UBSAN)
            os: ubuntu-24.04
            build_type: Debug
            cxx: clang++-18
            simd_backend: XSIMD
            arch_flags: ""
            cmake_flags: "-DAPRIL_USE_ASAN=ON -DAPRIL_USE_UBSAN=ON"
            run_tests: true

          - name: Linux (GCC 14, XSIMD, TSAN)
            os: ubuntu-24.04
            build_type: Debug
            cxx: g++-14
            simd_backend: XSIMD
            arch_flags: ""
            cmake_flags: "-DAPRIL_USE_TSAN=ON"
            run_tests: true

          # =========================================================
          # STD::SIMD
          # =========================================================

          - name: Linux (Clang 18, std::simd)
            os: ubuntu-24.04
            build_type: Release
            cxx: clang++-18
            simd_backend: STD_SIMD
            arch_flags: "-DAPRIL_MARCH=x86-64"
            cmake_flags: ""
            run_tests: true

          - name: Linux (GCC 14, std::simd, AVX2 + OpenMP)
            os: ubuntu-24.04
            build_type: Release
            cxx: g++-14
            simd_backend: STD_SIMD
            arch_flags: "-DAPRIL_MARCH=x86-64-v3"
            cmake_flags: "-DAPRIL_ENABLE_OPENMP=ON"
            run_tests: true

          # =========================================================
          # EXECUTOR COVERAGE
          # =========================================================

          - name: Windows (MSVC, XSIMD, AVX2 + OpenMP)
            os: windows-latest
            build_type: Release
            cxx: cl
            simd_backend: XSIMD
            arch_flags: "-DAPRIL_MSVC_ARCH=AVX2"
            cmake_flags: "-DAPRIL_ENABLE_OPENMP=ON"
            run_tests: true

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install Clang 18
        if: runner.os == 'Linux' && matrix.cxx == 'clang++-18'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18

      - name: Install GCC 14
        if: runner.os == 'Linux' && matrix.cxx == 'g++-14'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-14 g++-14

      - name: Set up MSVC Developer Command Prompt
        if: matrix.cxx == 'cl'
        uses: TheMrMilchmann/setup-msvc-dev@79dac248aac9d0059f86eae9d8b5bfab4e95e97c # v4.0.0
        with:
          arch: x64

      - name: Print C++ compiler
        if: matrix.cxx != 'cl'
        run: ${{ matrix.cxx }} --version

      - name: Print MSVC compiler
        if: matrix.cxx == 'cl'
        run: cl

      - name: Print build tools
        run: |
          cmake --version
          ninja --version

      - name: Print Linux CPU information
        if: runner.os == 'Linux'
        shell: bash
        run: |
          uname -m
          lscpu || true

      - name: Configure CMake
        run: >-
          cmake
          -G Ninja
          -S .
          -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DAPRIL_SIMD_BACKEND=${{ matrix.simd_backend }}
          -DAPRIL_BUILD_TESTS=ON
          -DAPRIL_BUILD_EXAMPLES=ON
          -DAPRIL_ENABLE_FAST_MATH=OFF
          ${{ matrix.arch_flags }}
          ${{ matrix.cmake_flags }}

      - name: Build all targets
        run: cmake --build build --config ${{ matrix.build_type }} --parallel

      - name: Run tests
        if: matrix.run_tests
        run: >-
          ctest
          --test-dir build
          --output-on-failure
          --build-config ${{ matrix.build_type }}

  coverage:
    name: Linux (Clang 18, Scalar, Coverage)
    runs-on: ubuntu-24.04

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install Clang 18
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 llvm-18

      - name: Configure CMake
        run: >-
          cmake
          -G Ninja
          -S .
          -B build-coverage
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER=clang++-18
          -DAPRIL_SIMD_BACKEND=SCALAR
          -DAPRIL_BUILD_TESTS=ON
          -DAPRIL_BUILD_EXAMPLES=OFF
          -DAPRIL_ENABLE_FAST_MATH=OFF
          -DAPRIL_ENABLE_COVERAGE=ON

      - name: Build
        run: cmake --build build-coverage --parallel

      - name: Run tests
        env:
          LLVM_PROFILE_FILE: ${{ github.workspace }}/build-coverage/test_april-%p.profraw
        run: |
          ctest \
            --test-dir build-coverage \
            --output-on-failure

      - name: Merge profile data
        run: |
          llvm-profdata-18 merge \
            -sparse \
            build-coverage/*.profraw \
            -o build-coverage/coverage.profdata

      - name: Generate coverage report
        run: |
          llvm-cov-18 export \
            -format=lcov \
            build-coverage/test/test_april \
            -instr-profile=build-coverage/coverage.profdata \
            -ignore-filename-regex="test/|external/|build-coverage/" \
            > build-coverage/coverage.lcov

      - name: Upload to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./build-coverage/coverage.lcov
          fail_ci_if_error: true